<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML 安全查看中心</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ece9e2;
        --panel: #fdfdfb;
        --panel-soft: #f1f4ef;
        --line: #c9d2c8;
        --line-strong: #aab8ab;
        --text: #16231d;
        --muted: #4f6258;
        --primary: #0b5f59;
        --primary-press: #084844;
        --ok: #0f766e;
        --sidebar-top: #203329;
        --sidebar-btm: #15261f;
        --sidebar-line: rgba(255, 255, 255, 0.12);
        --sidebar-icon: #d8ebe0;
        --shadow-sm: 0 1px 3px rgba(16, 28, 21, 0.12);
        --shadow-md: 0 18px 34px rgba(16, 28, 21, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(1200px 620px at 12% -18%, rgba(11, 95, 89, 0.16) 0%, transparent 60%),
          radial-gradient(980px 540px at 100% -20%, rgba(133, 94, 41, 0.14) 0%, transparent 56%),
          var(--bg);
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 78px minmax(0, 1fr);
      }

      .side-nav {
        position: sticky;
        top: 0;
        height: 100vh;
        border-right: 1px solid var(--sidebar-line);
        background: linear-gradient(180deg, var(--sidebar-top), var(--sidebar-btm));
        box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.04);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 18px 0 14px;
      }

      .nav-brand {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #f7fbff;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 0;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02));
      }

      .nav-btn {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--sidebar-icon);
        background: rgba(255, 255, 255, 0.03);
        display: grid;
        place-items: center;
        font-size: 18px;
        text-decoration: none;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.24);
      }

      .nav-btn.active {
        border-color: rgba(158, 215, 188, 0.72);
        background: linear-gradient(180deg, rgba(31, 107, 89, 0.36), rgba(24, 74, 62, 0.24));
      }

      .nav-spacer {
        flex: 1;
      }

      .side-nav .nav-btn:nth-of-type(n + 3),
      .side-nav .nav-spacer {
        display: none;
      }

      .content {
        padding: 20px;
      }

      .hero {
        margin-bottom: 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: linear-gradient(180deg, #ffffff, #f3f7f1);
        box-shadow: var(--shadow-sm);
        padding: 16px 18px;
      }

      .hero h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.15;
      }

      .hero p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.95fr) minmax(0, 1fr);
        gap: 14px;
      }

      .block {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: linear-gradient(180deg, var(--panel), var(--panel-soft));
        box-shadow: var(--shadow-sm);
      }

      .viewer-panel {
        overflow: hidden;
      }

      .viewer-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #fdfefc, #edf3ec);
      }

      .title {
        margin: 0;
        font-size: 14px;
        font-weight: 800;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 29px;
        border: 1px solid #b6c8b6;
        border-radius: 7px;
        background: #e8f0e6;
        color: #22433a;
        padding: 0 10px;
        font-size: 12px;
      }

      .toolbar-actions {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      code {
        border: 1px solid #b7c9b7;
        border-radius: 5px;
        background: #edf3ea;
        padding: 2px 7px;
        color: #24483d;
      }

      .viewer-shell {
        min-height: 74vh;
        background: #ffffff;
      }

      .viewer-empty {
        min-height: 74vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
        color: var(--muted);
      }

      .viewer-empty-card {
        width: min(460px, 100%);
        border: 1px solid #c2cfbf;
        border-radius: 10px;
        background:
          linear-gradient(180deg, #fbfdf9, #eef4ea),
          repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 10px,
            rgba(132, 152, 134, 0.1) 10px,
            rgba(132, 152, 134, 0.1) 11px
          );
        padding: 20px;
        box-shadow: var(--shadow-md);
      }

      .viewer-empty-card strong {
        display: block;
        color: var(--text);
        font-size: 16px;
        margin-bottom: 8px;
      }

      #viewer {
        width: 100%;
        min-height: 74vh;
        border: 0;
        display: none;
      }

      .control {
        padding: 14px;
      }

      .control + .control {
        border-top: 1px solid var(--line);
      }

      .label {
        margin: 0 0 7px;
        font-size: 12px;
        color: var(--muted);
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        align-items: end;
      }

      .key-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      input[type="password"],
      select {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #ffffff;
        color: var(--text);
        padding: 8px 12px;
        font-size: 14px;
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }

      select.select-placeholder {
        color: var(--muted);
      }

      input:hover,
      select:hover {
        border-color: var(--line-strong);
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(11, 95, 89, 0.22);
      }

      button {
        min-height: 42px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: #edf3ea;
        color: var(--text);
        padding: 8px 14px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
      }

      .btn-primary {
        border-color: var(--primary);
        background: linear-gradient(180deg, #1b7b71, var(--primary));
        color: #ffffff;
        box-shadow: 0 8px 18px rgba(11, 95, 89, 0.3);
      }

      .btn-primary:active {
        background: var(--primary-press);
        border-color: var(--primary-press);
      }

      .btn-ghost {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 0 10px;
        font-size: 12px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, #ffffff, #edf3ea);
        color: var(--text);
        text-decoration: none;
      }

      #docState {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 42px;
        padding: 0 10px;
        border-radius: 7px;
        border: 1px solid #c2cec0;
        background: linear-gradient(180deg, #fbfdf9, #edf3ea);
        color: #2a4d41;
        font-size: 13px;
      }

      #status {
        min-height: 132px;
        border: 1px solid #c5d0c3;
        border-radius: 7px;
        background: linear-gradient(180deg, #fbfdf9, #eef4ea);
        padding: 10px 12px;
        white-space: pre-wrap;
        font-size: 14px;
      }

      .status-title {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 700;
        color: #355547;
      }

      .admin-toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .admin-toggle-row .status-title {
        margin: 0;
      }

      .viewer-panel:fullscreen {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        border: 0;
      }

      .viewer-panel:fullscreen .viewer-shell {
        min-height: calc(100vh - 56px);
      }

      .viewer-panel:fullscreen #viewer,
      .viewer-panel:fullscreen .viewer-empty {
        min-height: calc(100vh - 56px);
      }

      .viewer-panel:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        border: 0;
      }

      .viewer-panel:-webkit-full-screen .viewer-shell,
      .viewer-panel:-webkit-full-screen #viewer,
      .viewer-panel:-webkit-full-screen .viewer-empty {
        min-height: calc(100vh - 56px);
      }

      @media (max-width: 1080px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 820px) {
        .app {
          grid-template-columns: 1fr;
        }

        .side-nav {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--sidebar-line);
          flex-direction: row;
          justify-content: center;
          padding: 10px 12px;
        }

        .nav-spacer {
          display: none;
        }

        .content {
          padding: 14px;
        }
      }

      @media (max-width: 760px) {
        .grid-2,
        .key-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="side-nav" aria-label="主导航">
        <div class="nav-brand">H</div>
        <a class="nav-btn active" href="./" aria-label="查看">▦</a>
        <a class="nav-btn" href="./admin/" aria-label="管理">⚙</a>
        <a class="nav-btn" href="./admin/" aria-label="上传">⇧</a>
        <div class="nav-spacer"></div>
        <a class="nav-btn" href="./admin/" aria-label="更多">⋯</a>
      </aside>

      <main class="content">
        <header class="hero">
          <h1>HTML 安全查看中心</h1>
          <p>打开页面默认进入文档工作区，选择 Doc ID 并输入 KEY 即可解锁查看。</p>
        </header>

        <section class="layout">
          <section class="block viewer-panel" id="viewerPanel">
            <div class="viewer-toolbar">
              <p class="title">文档查看区</p>
              <div class="toolbar-actions">
                <div class="meta">
                  <span class="chip">Doc ID: <code id="docId">-</code></span>
                  <span class="chip">访问方式: KEY</span>
                </div>
                <button id="fullscreenBtn" class="btn-ghost" type="button">全屏展开</button>
              </div>
            </div>
            <div class="viewer-shell">
              <div id="viewerEmpty" class="viewer-empty">
                <div class="viewer-empty-card">
                  <strong>文档已加密</strong>
                  请在右侧输入对应 KEY 进行访问。
                </div>
              </div>
              <iframe id="viewer" sandbox="allow-same-origin allow-scripts"></iframe>
            </div>
          </section>

          <section class="block" id="unlockPanel">
            <div class="control">
              <p class="title">KEY 访问</p>
            </div>

            <div class="control">
              <div class="grid-2">
                <div>
                  <p class="label">选择文档</p>
                  <select id="docSelect" aria-label="选择文档"></select>
                </div>
                <div>
                  <p class="label">文档状态</p>
                  <div id="docState">待解锁</div>
                </div>
              </div>
            </div>

            <div class="control">
              <div class="key-row">
                <input id="keyInput" type="password" placeholder="请输入访问 KEY" />
                <button id="unlockBtn" class="btn-primary" type="button">解锁访问</button>
              </div>
            </div>

            <div class="control">
              <p class="status-title">状态信息</p>
              <div id="status"></div>
            </div>

            <div class="control">
              <div class="admin-toggle-row">
                <p class="status-title">管理员操作</p>
                <a id="adminJumpBtn" class="btn-ghost" href="./admin/">进入管理界面</a>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script nomodule>
      (function () {
        var html = '' +
          '<div style="max-width:760px;margin:40px auto;padding:18px;border:1px solid #d9dee8;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;background:#fff;">' +
          '<h2 style="margin:0 0 10px 0;">浏览器不兼容</h2>' +
          '<p style="margin:0;color:#334155;line-height:1.6;">当前浏览器版本过低，无法打开加密文档。请使用最新版 Chrome / Edge，或 Safari 15 及以上版本。</p>' +
          '</div>';
        document.body.innerHTML = html;
      })();
    </script>
    <script type="module" src="./decrypt.js?v=20260807-view-17"></script>
  </body>
</html>
