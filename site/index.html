<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML 安全查看中心</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ece9e2;
        --surface: #fdfdfb;
        --surface-soft: #f1f4ef;
        --line: #c9d2c8;
        --line-strong: #aab8ab;
        --text: #16231d;
        --muted: #4f6258;
        --primary: #0b5f59;
        --primary-press: #084844;
        --accent: #b45309;
        --secondary: #e1e9e3;
        --ok: #0b5f59;
        --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.08);
        --shadow-md: 0 14px 30px rgba(16, 24, 40, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(1200px 440px at 0% -25%, rgba(16, 185, 129, 0.16) 0%, transparent 60%),
          radial-gradient(920px 420px at 100% -20%, rgba(180, 83, 9, 0.14) 0%, transparent 58%),
          radial-gradient(980px 420px at 50% -30%, rgba(148, 163, 184, 0.2) 0%, transparent 62%),
          var(--bg);
        color: var(--text);
      }

      .wrap {
        max-width: 1240px;
        margin: 24px auto;
        padding: 0 18px 26px;
      }

      .header {
        margin-bottom: 14px;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: linear-gradient(125deg, #fdfdfb, #f1f5f1 62%, #e9efe8);
        box-shadow: var(--shadow-sm);
      }

      .header h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.18;
      }

      .header p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.85fr) minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }

      .block {
        background: linear-gradient(180deg, var(--surface), var(--surface-soft));
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 8px 20px rgba(16, 24, 40, 0.08);
      }

      .viewer-panel {
        overflow: hidden;
      }

      .viewer-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #fcfdfc, #eef4ee);
      }

      .title {
        margin: 0;
        font-size: 14px;
        font-weight: 800;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        border: 1px solid #b7c8b9;
        border-radius: 6px;
        background: #e8f0e9;
        color: #274136;
        padding: 0 10px;
        font-size: 12px;
      }

      .toolbar-actions {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      code {
        border: 1px solid #b8cab9;
        border-radius: 4px;
        background: #e8f0e9;
        padding: 2px 7px;
        color: #254238;
      }

      .viewer-shell {
        min-height: 74vh;
        background: #fdfefc;
      }

      .viewer-empty {
        min-height: 74vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 22px;
        color: var(--muted);
      }

      .viewer-empty-card {
        width: min(460px, 100%);
        border: 1px solid #c2cec4;
        border-radius: 8px;
        background:
          linear-gradient(180deg, #fbfcfa, #edf2ed),
          repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 10px,
            rgba(148, 163, 184, 0.08) 10px,
            rgba(148, 163, 184, 0.08) 11px
          );
        padding: 20px;
        box-shadow: var(--shadow-md);
      }

      .viewer-empty-card strong {
        display: block;
        color: var(--text);
        font-size: 16px;
        margin-bottom: 8px;
      }

      #viewer {
        width: 100%;
        min-height: 74vh;
        border: 0;
        display: none;
      }

      .control {
        padding: 14px;
      }

      .control + .control {
        border-top: 1px solid var(--line);
      }

      .label {
        margin: 0 0 7px;
        font-size: 12px;
        color: var(--muted);
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        align-items: end;
      }

      .key-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      input[type="password"],
      select {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fdfefc;
        color: var(--text);
        padding: 8px 12px;
        font-size: 14px;
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }

      select.select-placeholder {
        color: var(--muted);
      }

      input:hover,
      select:hover {
        border-color: var(--line-strong);
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(11, 95, 89, 0.2);
      }

      button {
        min-height: 42px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--secondary);
        color: var(--text);
        padding: 8px 14px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
      }

      .btn-primary {
        border-color: var(--primary);
        background: linear-gradient(180deg, #139188, var(--primary));
        color: #ffffff;
        box-shadow: 0 8px 18px rgba(11, 95, 89, 0.28);
      }

      .btn-primary:active {
        background: var(--primary-press);
        border-color: var(--primary-press);
      }

      .btn-ghost {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 0 10px;
        font-size: 12px;
        border: 1px solid var(--line);
        border-color: #b8c9ba;
        background: linear-gradient(180deg, #fdfefc, #eaf1eb);
        color: var(--text);
        text-decoration: none;
      }

      #docState {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 42px;
        padding: 0 10px;
        border-radius: 6px;
        border: 1px solid #b9cabb;
        background: linear-gradient(180deg, #f9fcf8, #eaf1eb);
        color: #2f4b3f;
        font-size: 13px;
      }

      #status {
        min-height: 132px;
        border: 1px solid #c2cec4;
        border-radius: 6px;
        background: linear-gradient(180deg, #f8fbf7, #edf2ed);
        padding: 10px 12px;
        white-space: pre-wrap;
        font-size: 14px;
      }

      .status-title {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 700;
        color: #2f4a3f;
      }

      .admin-toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .admin-toggle-row .status-title {
        margin: 0;
      }

      .viewer-panel:fullscreen {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        border: 0;
      }

      .viewer-panel:fullscreen .viewer-shell {
        min-height: calc(100vh - 56px);
      }

      .viewer-panel:fullscreen #viewer,
      .viewer-panel:fullscreen .viewer-empty {
        min-height: calc(100vh - 56px);
      }

      .viewer-panel:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        border: 0;
      }

      .viewer-panel:-webkit-full-screen .viewer-shell,
      .viewer-panel:-webkit-full-screen #viewer,
      .viewer-panel:-webkit-full-screen .viewer-empty {
        min-height: calc(100vh - 56px);
      }

      @media (max-width: 1000px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 760px) {
        .grid-2,
        .key-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="header">
        <h1>HTML 安全查看中心</h1>
        <p>打开页面默认进入文档工作区，选择 Doc ID 并输入 KEY 即可解锁查看。</p>
      </header>

      <section class="layout">
        <section class="block viewer-panel" id="viewerPanel">
          <div class="viewer-toolbar">
            <p class="title">文档查看区</p>
            <div class="toolbar-actions">
              <div class="meta">
                <span class="chip">Doc ID: <code id="docId">default</code></span>
                <span class="chip">访问方式: KEY</span>
              </div>
              <button id="fullscreenBtn" class="btn-ghost" type="button">全屏展开</button>
            </div>
          </div>
          <div class="viewer-shell">
            <div id="viewerEmpty" class="viewer-empty">
              <div class="viewer-empty-card">
                <strong>文档已加密</strong>
                请在右侧输入对应 KEY 进行访问。
              </div>
            </div>
            <iframe id="viewer" sandbox="allow-same-origin allow-scripts"></iframe>
          </div>
        </section>

        <section class="block" id="unlockPanel">
          <div class="control">
            <p class="title">KEY 访问</p>
          </div>

          <div class="control">
            <div class="grid-2">
              <div>
                <p class="label">选择文档</p>
                <select id="docSelect" aria-label="选择文档"></select>
              </div>
              <div>
                <p class="label">文档状态</p>
                <div id="docState">待解锁</div>
              </div>
            </div>
          </div>

          <div class="control">
            <div class="key-row">
              <input id="keyInput" type="password" placeholder="请输入访问 KEY" />
              <button id="unlockBtn" class="btn-primary" type="button">解锁访问</button>
            </div>
          </div>

          <div class="control">
            <p class="status-title">状态信息</p>
            <div id="status"></div>
          </div>

          <div class="control">
            <div class="admin-toggle-row">
              <p class="status-title">管理员操作</p>
              <a id="adminJumpBtn" class="btn-ghost" href="./admin/">进入管理界面</a>
            </div>
          </div>
        </section>
      </section>
    </main>
    <script nomodule>
      (function () {
        var html = '' +
          '<div style="max-width:760px;margin:40px auto;padding:18px;border:1px solid #d9dee8;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;background:#fff;">' +
          '<h2 style="margin:0 0 10px 0;">浏览器不兼容</h2>' +
          '<p style="margin:0;color:#334155;line-height:1.6;">当前浏览器版本过低，无法打开加密文档。请使用最新版 Chrome / Edge，或 Safari 15 及以上版本。</p>' +
          '</div>';
        document.body.innerHTML = html;
      })();
    </script>
    <script type="module" src="./decrypt.js?v=20260806-view-15"></script>
  </body>
</html>
