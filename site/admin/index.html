<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>安全报告管理台</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f5f9;
        --surface: #ffffff;
        --surface-tint: #fafbff;
        --line: #d9dee8;
        --line-strong: #c6cedc;
        --text: #1e293b;
        --muted: #64748b;
        --primary: #0e7490;
        --primary-press: #0b5f75;
        --secondary: #eff3f8;
        --accent: #b45309;
        --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04);
        --shadow-md: 0 10px 24px rgba(16, 24, 40, 0.06);
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(1200px 420px at 0% -10%, #ffffff 0%, transparent 60%),
          radial-gradient(900px 360px at 100% -15%, #eef4ff 0%, transparent 55%),
          var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 1120px;
        margin: 30px auto;
        padding: 0 20px 28px;
      }
      .header {
        margin-bottom: 18px;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: linear-gradient(135deg, #ffffff, #f7fafe);
        box-shadow: var(--shadow-sm);
      }
      .header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .header h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.2;
        letter-spacing: 0;
      }
      .header p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .layout {
        display: grid;
        grid-template-columns: 1.25fr 1fr;
        gap: 14px;
      }
      .block {
        background: linear-gradient(180deg, var(--surface), var(--surface-tint));
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        box-shadow: var(--shadow-sm);
      }
      .row {
        display: grid;
        gap: 10px;
      }
      .row + .row {
        margin-top: 10px;
      }
      .cols-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .cols-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .cols-mix {
        grid-template-columns: 1.6fr auto auto;
      }
      .cols-key {
        grid-template-columns: auto 1fr;
      }
      .section-title {
        font-size: 14px;
        font-weight: 800;
        margin: 0 0 10px;
        color: #0f172a;
      }
      .label {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 6px;
      }
      input[type="text"],
      input[type="password"],
      input[type="file"],
      select {
        width: 100%;
        box-sizing: border-box;
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        padding: 8px 12px;
        font-size: 14px;
        transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }
      input:hover,
      select:hover {
        border-color: var(--line-strong);
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: #0891b2;
        box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.16);
      }
      button {
        min-height: 40px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--secondary);
        color: var(--text);
        padding: 8px 14px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 80ms ease, box-shadow 120ms ease, filter 120ms ease, border-color 120ms ease;
        box-shadow: var(--shadow-sm);
      }
      button:hover {
        border-color: var(--line-strong);
        filter: brightness(0.99);
      }
      button:active {
        transform: translateY(1px);
      }
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.18);
      }
      .btn-primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
        box-shadow: 0 6px 14px rgba(14, 116, 144, 0.22);
      }
      .btn-primary:active {
        background: var(--primary-press);
        border-color: var(--primary-press);
      }
      .btn-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, #ffffff, #f5f8ff);
        color: var(--text);
        padding: 0 12px;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }
      .repo {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }
      code {
        background: #f6f8fc;
        border: 1px solid #e5eaf3;
        border-radius: 4px;
        padding: 1px 5px;
        color: #334155;
      }
      #status {
        min-height: 88px;
        border: 1px solid #dbe3ef;
        border-radius: 6px;
        background: linear-gradient(180deg, #fcfdff, #f7faff);
        padding: 10px 12px;
        white-space: pre-wrap;
        font-size: 14px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      }
      .hint {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
        border-left: 3px solid rgba(180, 83, 9, 0.45);
        padding-left: 9px;
      }
      .full {
        grid-column: 1 / -1;
      }
      .status-block {
        grid-column: 1 / -1;
      }
      @media (max-width: 960px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 760px) {
        .cols-3,
        .cols-2,
        .cols-mix,
        .cols-key {
          grid-template-columns: 1fr;
        }
        .header-top {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="header">
        <div class="header-top">
          <h1>管理员上传与密钥查询</h1>
          <a class="btn-link" href="../?v=20260805-view6">返回查看界面</a>
        </div>
        <p>统一处理 HTML 上传、密钥查询、流程状态检查。</p>
      </header>

      <section class="layout" id="adminPanel">
        <section class="block">
          <p class="section-title">仓库连接</p>
          <p class="repo">目标仓库：<code id="repoLabel">JJCODEWH/HTML-SECURE-REPORT-ADMIN@main</code></p>
          <div class="row cols-3">
            <div>
              <p class="label">Owner</p>
              <input id="owner" type="text" value="JJCODEWH" placeholder="组织/用户" />
            </div>
            <div>
              <p class="label">Repository</p>
              <input id="repo" type="text" value="HTML-SECURE-REPORT-ADMIN" placeholder="私有仓库名" />
            </div>
            <div>
              <p class="label">Branch</p>
              <input id="branch" type="text" value="main" placeholder="分支名" />
            </div>
          </div>
          <div class="row cols-2">
            <input id="token" type="password" autocomplete="off" placeholder="管理员 PAT（repo 权限）" />
            <button id="loadFilesBtn" type="button">加载 incoming</button>
          </div>
        </section>

        <section class="block">
          <p class="section-title">文档与密钥</p>
          <div class="row cols-2">
            <div>
              <p class="label">选择已有文档</p>
              <select id="incomingSelect" aria-label="existing incoming files">
                <option value="">incoming/ 现有文件（可选）</option>
              </select>
            </div>
            <div>
              <p class="label">Doc ID</p>
              <input id="docId" type="text" placeholder="默认取文件名" />
            </div>
          </div>
          <div class="row cols-key">
            <button id="viewKeyBtn" type="button">按 Doc ID 查 KEY</button>
            <input id="keyOutput" type="text" readonly placeholder="这里显示 KEY" />
          </div>
        </section>

        <section class="block full">
          <p class="section-title">上传与加密</p>
          <div class="row cols-mix">
            <input id="htmlFile" type="file" accept=".html,text/html" />
            <button id="uploadBtn" class="btn-primary" type="button">上传并触发加密</button>
            <button id="checkRunsBtn" type="button">查看流程状态</button>
          </div>
          <p class="hint">
            上传路径：<code>incoming/&lt;doc-id&gt;.html</code>。提交后会触发私有仓库自动加密，并同步公开 payload。
          </p>
        </section>

        <section class="block full">
          <p class="section-title">删除文件</p>
          <div class="row cols-2">
            <input id="deleteDocId" type="text" placeholder="输入要删除的 Doc ID（例如 report-001）" />
            <button id="deleteBtn" type="button">删除 incoming 文件</button>
          </div>
          <p class="hint">
            删除会同时清理私有仓库（incoming / key-map / keys）与公开仓库（payload 与 manifest）对应内容。
          </p>
        </section>

        <section class="block status-block">
          <p class="section-title">状态信息</p>
          <div id="status"></div>
        </section>
      </section>
    </main>
    <script src="./admin.js?v=20260805-7"></script>
  </body>
</html>
